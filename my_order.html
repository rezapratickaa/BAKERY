<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TEFA Bakery - Pesanan Saya</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="assets/css/navbar.css" />
  <link rel="stylesheet" href="assets/css/footer.css" />
  <link rel="stylesheet" href="assets/css/my_order.css">
</head>
<body>
  <div data-component="assets/components/navbar.html"></div>

  <main class="container">
    <div class="breadcrumb">
      <a href="home.html">Home</a><span>›</span>
      <a href="contact_detail.html">My Account</a><span>›</span>
      <span class="current">My Orders</span>
    </div>

    <section class="account-layout">
      <aside class="sidebar">
        <p class="welcome">Welcome to your Account</p>
        <ul>
          <li class="selected"><a href="my_order.html"><span>♧</span> My orders</a></li>
          <li><a href="wishlist.html"><span>♡</span> Wishlist</a></li>
          <li><a href="contact_detail.html"><span>♙</span> My info</a></li>
          <li><a href="#" id="orderSignOut"><span>⇥</span> Sign out</a></li>
        </ul>
      </aside>

      <section class="orders-section">
        <h1>Order</h1>
        <div class="tabs" role="tablist" aria-label="Status pesanan">
          <button class="tab active" data-status="active" role="tab" aria-selected="true">Active</button>
          <button class="tab" data-status="cancelled" role="tab" aria-selected="false">Cancelled</button>
          <button class="tab" data-status="completed" role="tab" aria-selected="false">Completed</button>
        </div>

        <div id="ordersList" class="orders-list" aria-live="polite"></div>
        <p id="emptyMessage" class="empty-message" hidden>Tidak ada pesanan pada kategori ini.</p>
      </section>
    </section>
  </main>

  <div data-component="assets/components/footer.html"></div>

  

  <script src="assets/js/my_order.js"></script>
  <script src="assets/js/script.js"></script>
</body>
</html>
