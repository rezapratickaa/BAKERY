<div class="menu-card">
    <div class="menu-img-wrapper">
        {{image}}
    </div>
    <div class="menu-card-body">
        <div class="menu-card-info">
            <h4 class="menu-name">{{name}}</h4>
            <p class="menu-price">{{price}}</p>
            <div class="menu-meta">
                <span class="menu-rating"><i class="fa-solid fa-star"></i> {{rating}}</span>
                <span class="menu-sold">· {{sold}}</span>
            </div>
        </div>
        <button class="menu-add-btn" title="Tambah ke keranjang"><i class="fa-solid fa-plus"></i></button>
    </div>
</div>
